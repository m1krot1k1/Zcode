exceptions:
  # Two focused helpers added with the root-auto and crash-resume specs. Keep the
  # exception path-exact; do not widen it to the whole zcode-cli tree.
  - rule: unmanaged-new-file
    paths:
      # Этап 6.1b: версия приложения для не-упакованного Electron.
      # electron-updater читает app.getVersion() при импорте main-бандла и падает на "0.0";
      # bootstrap обязан выполниться ДО остальных import'ов, поэтому живёт одним файлом
      # в unmanaged-корне packages/desktop/src/main рядом с другими desktopEarly*.
      # Исключение path-exact: модуль из двух файлов вокруг двух строк был бы накладным.
      - packages/desktop/src/main/desktopAppVersionBootstrap.ts
      - packages/desktop/src/main/desktopEarlyAppVersionBootstrap.ts
      - apps/zcode-cli/packages/bootstrap/src/zcode-protocol/auto-resume.ts
      - apps/zcode-cli/packages/core/src/subagent/definitions.ts
      # Skill→agent provisioning: the runtime listing and the shared profile
      # contract/parser live in legacy unmanaged package roots. Keep these three
      # paths exact instead of registering a module around single contract files.
      - apps/zcode-cli/packages/core/src/subagent/listing.ts
      - packages/shared/src/subagent-profile.ts
      - packages/shared/src/subagent-profile-parser.ts
      - apps/zcode-cli/packages/core/src/runtime/helpers/root-auto-effort.ts
      # Child effort resolver for the relative effort class; path-exact for the
      # same unmanaged zcode-cli module.
      - apps/zcode-cli/packages/core/src/runtime/helpers/subagent-effort.ts
      # Tool presentation projection added with the UI usage/telemetry work;
      # the ui module is unmanaged, so keep the exception path-exact.
      - packages/ui/src/ToolCallBlocks/ToolPresentation.tsx
      # Initial-import runtime file; the legacy zcode-cli module is unmanaged, and a
      # path-exact exception is the existing convention for these two helpers.
      - apps/zcode-cli/packages/core/src/runtime/off-peak/runtime.ts
      # Capability installer feature: four focused files, not a new module. Keep the
      # exception path-exact; do not widen it to the whole zcode-cli tree.
      - apps/zcode-cli/packages/bootstrap/src/app/capability-install-port.ts
      - apps/zcode-cli/packages/bootstrap/src/app/plugin-runtime-catalog.ts
      - apps/zcode-cli/packages/contracts/src/interfaces/capability-install.port.ts
      - apps/zcode-cli/packages/contracts/src/tools/capability-install.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/capability-install.ts
      # Increment 4.2: MultiEdit tool contract/handler and the shared transaction
      # event hook live inside the unmanaged zcode-cli module by design (they are
      # tool components, not a separate module). Keep path-exact.
      - apps/zcode-cli/packages/contracts/src/tools/multi-edit.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/multi-edit.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/transaction-hooks.ts
      # Increment 4.2: file-transaction event schema extends the shared protocol
      # surface; the shared module is managed at package level only.
      - packages/shared/src/zcode-protocol/schema-file-transaction.ts
      # Increment 4.2: one projection file next to session events; the ui module
      # is unmanaged, so keep the exception path-exact.
      - packages/ui/src/lib/zcodeSessionProjection/fileTransactions.ts
      # Этап 6.1c: проводка реактивных диффов в таймлайн. Модуль `ui` unmanaged на уровне
      # пакета, поэтому держим path-exact на шесть файлов одной фичи: модель проекции
      # события, изоляция по workspaceKey, store, подписка, панель и обёртка tool-блока.
      # Регистрировать отдельный managed-модуль из шести файлов было бы накладным и
      # разорвало бы соседство с остальными v4-компонентами.
      - packages/ui/src/lib/fileTransactionProjection.ts
      - packages/ui/src/lib/fileTransactionWorkspaceScope.ts
      - packages/ui/src/store/fileTransactionStore.ts
      - packages/ui/src/hooks/useFileTransactionStream.ts
      - packages/ui/src/v4/FileTransactionSummaryPanel.tsx
      - packages/ui/src/v4/ToolFileTransactionSummary.tsx
      # Increment 4.5a: instrument PtySession — это tool-компонент внутри
      # unmanaged zcode-cli, как MultiEdit/Bash. Держим исключение path-exact;
      # сама песочница и PTY-менеджер живут в managed-модулях adapters.
      - apps/zcode-cli/packages/contracts/src/tools/pty-session.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/pty-session.ts
      # Increment 4.5b: схема BrowserActionObservation — общий контракт телеметрии для
      # адаптера и потребителей. Модуль shared unmanaged на уровне пакета; исключение path-exact.
      - packages/shared/src/browser-use/observation.ts
      # Increment 4.6: проводка существующих Host-сервисов к PromptEnhancerService.
      # Это не модуль, а один файл рядом с остальными `src/node/*` сервисными проводами
      # в unmanaged-корне services; логика улучшения живёт в managed `prompt-enhancer`.
      - packages/services/src/node/prompt-enhancer-ports.ts
      # Increment 4.4: профили глубины промпта — один enum, который читают настройки,
      # рантайм промпта и UI композера. Модуль shared unmanaged на уровне пакета,
      # отдельный модуль из одного файла был бы накладным; исключение path-exact.
      - packages/shared/src/prompt-depth.ts
      # Increment 4.6: React-хук доступа к PromptEnhancerService. Хук — это слой доступа
      # ui к сервису, а не самостоятельный модуль; ui unmanaged на уровне пакета.
      - packages/ui/src/hooks/usePromptEnhancer.ts
      # Initial-import файл рекомендованных промптов; менялся только для удаления
      # захардкоженных CDN-иконок. ui unmanaged на уровне пакета, поэтому path-exact.
      - packages/ui/src/v4/featureSuggestedPrompts.ts
      # Increment 4.3: воспроизводимый бенчмарк кодового индекса. Это dev-скрипт
      # (запускается вручную, не попадает в сборку пакета), поэтому регистрировать его
      # как модуль не имеет смысла; держим исключение path-exact на один файл,
      # не расширяя его на весь packages/services/bench.
      - packages/services/bench/code-intelligence-bench.mjs
      # Increment 4.4/4.6: команда `/enhance` и её формат результата. Это tool-компоненты
      # внутри unmanaged zcode-cli, как MultiEdit/Bash/PtySession — модуля не образуют.
      - apps/zcode-cli/packages/cli/src/enhance-command.ts
      - apps/zcode-cli/packages/cli/src/command-center/handlers/enhance.ts
      # Increment 4.4: когнитивные протоколы — секция системного контекста внутри
      # unmanaged zcode-cli core; живёт рядом с остальными `context/sections/*`.
      - apps/zcode-cli/packages/core/src/context/cognitive-protocols.ts
      # Increment 4.6: жизненный цикл protocol-канала Host'а для enhance-запросов;
      # один файл рядом с остальной проводкой CLI в unmanaged zcode-cli.
      - apps/zcode-cli/packages/cli/src/protocol-lifecycle.ts
      # Этап 5: разбиение `agent-runtime.ts` (858 → 508 значимых строк) под лимит
      # `max-lines`. Публичная поверхность вынесена в отдельный файл declaration merging;
      # это не модуль, а часть того же unmanaged zcode-cli core.
      - apps/zcode-cli/packages/core/src/runtime/agent-runtime-surface.ts
      # Этап 5: разбиение `turn-model-step.ts` (830 → под 800) под лимит `max-lines`.
      # Диагностика шага и ветка output-token-limit вынесены в соседние helpers
      # того же unmanaged zcode-cli core; поведение и порядок событий не менялись.
      - apps/zcode-cli/packages/core/src/runtime/methods/turn-model-step-diagnostics.ts
      - apps/zcode-cli/packages/core/src/runtime/methods/turn-model-step-output-limit.ts
      # Этап 5: разбиение `context/index.ts` (831 → 795 значимых строк) под лимит
      # `max-lines`. Кеш и секция workspace facts вынесены в отдельные файлы того же
      # unmanaged zcode-cli; публичные экспорты, ключи и порядок источников не менялись.
      - apps/zcode-cli/packages/adapters/src/context/workspace-facts.ts
      - apps/zcode-cli/packages/adapters/src/context/workspace-facts-cache.ts
      - apps/zcode-cli/packages/adapters/src/context/workspace-facts-wiring.ts
      - apps/zcode-cli/packages/core/src/context/sections/workspace-facts.ts

global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json
