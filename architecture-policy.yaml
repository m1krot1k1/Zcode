    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/tool/handlers/amend-workflow.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/list-models.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/fill-workflow-hole.ts
      - apps/zcode-cli/packages/core/src/tool/workflow-entrypoints/contract.ts
    layers: { app: . }
    owner: agent

  - id: tool-result-settlement
    roots:
      - apps/zcode-cli/packages/core/src/runtime/tool-result-settlement
      - apps/zcode-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/zcode-cli/packages/core/tests/tool-result-settlement
    managed: true
    requires: [ zcode-cli ]
    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/zcode-cli/packages/core/src/runtime/tool-result-settlement/contract.ts
    layers: { app: . }
    owner: agent
  - id: channel-reply-tool
    roots:
      - apps/zcode-cli/packages/core/src/tool/channel-reply
      - apps/zcode-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/zcode-cli/packages/core/tests/channel-reply
    managed: true
    requires: [ shared, zcode-cli ]
    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/zcode-cli/packages/core/src/tool/channel-reply/contract.ts
    layers: { app: . }
    owner: agent

  # composer-toolbar-layout：登记既有 DOM 布局入口，不改调用路径。
  - id: composer-toolbar-layout
    roots:
      - packages/ui/src/composer-toolbar-layout
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
      - packages/ui/test/composer-toolbar-layout
    managed: true
    requires: []
    publicEntrypoints:
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
      - packages/ui/src/composer-toolbar-layout/contract.ts
    layers: { ui: . }
    owner: conversation

  # task-groups：由 architecture:adopt 登记
  - id: task-groups
    roots:
      - packages/services/src/task-groups
    managed: true
    requires:
      - services
      - session
      - shared
    publicEntrypoints:
      - packages/services/src/task-groups/index.ts
      - packages/services/src/task-groups/contract.ts
      - packages/services/src/task-groups/migration-v6.ts
    layers:
      adapters: .
    owner: conversation

  # window-project-directory：由 architecture:adopt 登记
  - id: window-project-directory
    roots:
      - packages/services/src/window-project-directory
    managed: true
    requires:
      - project
      - remote-projects
      - rpc
      - services
      - shared
    publicEntrypoints:
      - packages/services/src/window-project-directory/index.ts
      - packages/services/src/window-project-directory/contract.ts
    layers:
      adapters: .
    owner: conversation
  # conversation-share-interaction：由 architecture:adopt 登记
  - id: conversation-share-interaction
    roots:
      - packages/ui/src/conversation-share-interaction
    managed: true
    requires:
      - services
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/conversation-share-interaction/index.ts
      - packages/ui/src/conversation-share-interaction/contract.ts
      - packages/ui/src/conversation-share-interaction/ConversationSharePopover.tsx
      - packages/ui/src/conversation-share-interaction/ConversationSharePreflightStatus.tsx
      - packages/ui/src/conversation-share-interaction/conversationSharePopoverActions.ts
      - packages/ui/src/conversation-share-interaction/conversationSharePreflightRequest.ts
      - packages/ui/src/conversation-share-interaction/conversationSharePreflightResponse.ts
    layers:
      contract: contract.ts
      ui: .
    owner: conversation

  # workspace-plugin-preview：由 architecture:adopt 登记
  - id: workspace-plugin-preview
    roots:
      - packages/ui/src/workspace-plugin-preview
    managed: true
    requires:
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/workspace-plugin-preview/index.ts
      - packages/ui/src/workspace-plugin-preview/contract.ts
    layers:
      ui: .
    owner: plugin

  # office-runtime：内置文档插件查看面板的共享运行时，由 architecture:adopt 登记
  - id: office-runtime
    roots:
      - apps/zcode-cli/packages/office-runtime
    managed: true
    requires: []
    publicEntrypoints:
      - apps/zcode-cli/packages/office-runtime/index.ts
      - apps/zcode-cli/packages/office-runtime/contract.ts
    layers:
      app: .
    owner: plugin

  # embedded-browser-permission：由 architecture:adopt 登记
  - id: embedded-browser-permission
    roots:
      - packages/desktop/src/main/embedded-browser-permission-contract
      - packages/desktop/src/main/embeddedBrowserPermissionPolicy.ts
    managed: true
    requires:
      - desktop
      - shared
    publicEntrypoints:
      - packages/desktop/src/main/embeddedBrowserPermissionPolicy.ts
