name: Cross-platform Preview release

on:
  # macOS Preview releases are built and published locally while GitHub Actions billing is
  # unavailable. Keep cross-platform builds manual; a tag created by the local release must not
  # spawn a failing workflow run.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and attach platform assets to
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            os: mac
            arch: arm64
            artifact: macos-arm64
          - label: Windows x64
            runner: windows-2025
            os: win
            arch: x64
            artifact: windows-x64
          - label: Linux AMD64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Verify tag matches package version
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); const tag=process.env.RELEASE_TAG; if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || `v${p.version}` !== tag) { console.error(`Release tag ${tag} does not match package version ${p.version}`); process.exit(1); }'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build offline Preview Desktop
        shell: bash
        env:
          ZCODE_ENV: test
          ZCODE_OFFLINE_PREVIEW: "1"
          ZCODE_BASE_URL: http://127.0.0.1:0
          ZCODE_ENDPOINT_ORIGIN: http://127.0.0.1:0
          ZCODE_TEST_BASE_URL: http://127.0.0.1:0
          ZCODE_PRODUCTION_BASE_URL: http://127.0.0.1:0
          VITE_ZCODE_BASE_URL: http://127.0.0.1:0
          VITE_ZCODE_ENDPOINT_ORIGIN: http://127.0.0.1:0
          ZCODE_ARMS_RUM_ENDPOINT: ""
          ZCODE_TELEMETRY_REPORT_ENDPOINT: ""
          ZCODE_AUTO_UPDATE: "0"
          ZCODE_PREVIEW_IDENTITY: "1"
          ZCODE_ENABLE_MAC_SIGN: "0"
          ZCODE_ENABLE_MAC_NOTARIZE: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm bundle:desktop -- --os "${{ matrix.os }}" --arch "${{ matrix.arch }}"
      - name: Stage versioned Desktop artifacts
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const path=require("node:path"); const version=process.env.RELEASE_TAG.slice(1); const dir="packages/desktop/dist"; const files=fs.readdirSync(dir).filter((f)=>/\.(dmg|zip|exe|AppImage|deb|rpm|pkg\.tar\.zst)$/i.test(f)); if(!files.length) throw new Error(`No Desktop artifacts in ${dir}`); const out=`release-assets/desktop-${process.env.TARGET}`; fs.mkdirSync(out,{recursive:true}); for(const f of files) fs.copyFileSync(path.join(dir,f),path.join(out,`ZCode-Preview-${version}-${process.env.TARGET}-${f}`)); console.log(files.join("\n"));'
        env:
          TARGET: ${{ matrix.artifact }}
      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: release-assets/desktop-${{ matrix.artifact }}/*
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            target: darwin-arm64
            artifact: macos-arm64
            file: zcode-darwin-arm64
          - label: Windows x64
            runner: windows-2025
            target: win-x64
            artifact: windows-x64
            file: zcode-windows-x64.exe
          - label: Linux AMD64
            runner: ubuntu-24.04
            target: linux-x64
            artifact: linux-x64
            file: zcode-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Verify tag matches package version
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); const tag=process.env.RELEASE_TAG; if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || `v${p.version}` !== tag) { console.error(`Release tag ${tag} does not match package version ${p.version}`); process.exit(1); }'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and smoke-test standalone CLI
        shell: bash
        run: |
          pnpm --dir apps/zcode-cli exec turbo --skip-infer --cwd apps/zcode-cli run build --filter=!@zcode/cli --force
          pnpm --filter @zcode/cli build
          pnpm --filter @zcode/cli exec node scripts/build-sea.mjs --target "${{ matrix.target }}"
          node --input-type=module -e 'import { access, chmod, copyFile, mkdir } from "node:fs/promises"; import { spawnSync } from "node:child_process"; import path from "node:path"; const src=path.resolve("apps/zcode-cli/packages/cli/dist",process.env.CLI_FILE); await access(src); if(process.platform !== "win32") await chmod(src,0o755); const probe=spawnSync(src,["--version"],{encoding:"utf8",timeout:30000}); if(probe.status!==0) throw new Error(`CLI smoke test failed: ${probe.stderr||probe.stdout||probe.error}`); const out=path.resolve("release-assets",`cli-${process.env.TARGET}`); await mkdir(out,{recursive:true}); await copyFile(src,path.join(out,`${process.env.CLI_FILE.replace(/\.exe$/i,"")}-${process.env.RELEASE_TAG.slice(1)}${process.env.CLI_FILE.endsWith(".exe")?".exe":""}`)); console.log(probe.stdout.trim());'
        env:
          CLI_FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: release-assets/cli-${{ matrix.artifact }}/*
          if-no-files-found: error

  publish:
    name: Publish Preview prerelease
    needs: [desktop, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Checkout tagged source for release verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Verify release tag matches package version
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); const tag=process.env.RELEASE_TAG; if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || `v${p.version}` !== tag) { console.error(`Release tag ${tag} does not match package version ${p.version}`); process.exit(1); }'
      - name: Validate complete release asset set
        shell: bash
        run: |
          find release-assets -type f -print
          for target in macos-arm64 windows-x64 linux-x64; do
            test -n "$(find release-assets -type f -iname "*${target}*" -print -quit)" || { echo "Missing release files for ${target}" >&2; exit 1; }
          done
          test "$(find release-assets -type f | wc -l | tr -d ' ')" -ge 10
      - name: Create or update Preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          title="ZCode Preview ${RELEASE_TAG#v} для macOS, Windows и Linux"
          notes="Кроссплатформенная Preview-сборка ZCode. Desktop включает macOS Apple Silicon, Windows x64 и Linux AMD64; CLI включает те же три платформы. ZCode backend/account, телеметрия и автообновления отключены. Внешние провайдеры и OpenCode CLI работают отдельно. macOS-пакет не подписан и не notarized; при первом запуске macOS может потребовать подтверждение. Это Preview, не production-релиз."
          existing_release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish 2>/dev/null || true)"
          if [ -n "$existing_release" ]; then
            RELEASE_JSON="$existing_release" TARGET_SHA="$target_sha" node -e 'const r=JSON.parse(process.env.RELEASE_JSON); if(r.tagName!==process.env.RELEASE_TAG) throw new Error("Existing release tag mismatch"); if(!r.isPrerelease) throw new Error("Refusing to modify a stable release"); if(r.targetCommitish!==process.env.TARGET_SHA) throw new Error("Existing prerelease points to another commit");'
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --verify-tag
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_sha" \
              --title "$title" \
              --prerelease \
              --notes "$notes" \
              --verify-tag
          fi
