name: PRISM candidate checks

on:
  # pull_request_target keeps this policy from the trusted base branch; permissions stay read-only.
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: prism-candidate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  candidate-checks:
    name: Verify exact PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVIDENCE_DIR: ${{ github.workspace }}/prism-candidate-evidence
    steps:
      - name: Initialize evidence manifest
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'claim=Only the listed checks ran on this candidate; this does not prove semantic improvement or authorize promotion/release.\n'
            printf 'head_sha=%s\n' "$PR_HEAD_SHA"
            printf 'base_sha=%s\n' "$PR_BASE_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
          } > "$EVIDENCE_DIR/manifest.txt"
          {
            printf '# PRISM candidate checks\n\n'
            printf 'Candidate: `%s`\n\n' "$PR_HEAD_SHA"
            printf 'Base: `%s`\n\n' "$PR_BASE_SHA"
            printf 'Run: `%s` (attempt `%s`)\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Evidence is limited to the listed checks; it does not prove semantic improvement or authorize promotion/release.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository-pinned toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true

      - name: Record installed toolchain versions
        shell: bash
        run: |
          set +e
          {
            printf 'mise='; mise --version
            printf 'node='; node --version
            printf 'pnpm='; pnpm --version
          } 2>&1 | tee "$EVIDENCE_DIR/toolchain.log"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/install.log"
          status=${PIPESTATUS[0]}
          printf 'gate=install\tcommand=pnpm install --frozen-lockfile\texit=%s\n' "$status" >> "$EVIDENCE_DIR/results.tsv"
          printf '\nDependency install exit code: `%s`.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run candidate gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          results="$EVIDENCE_DIR/results.tsv"
          touch "$results"
          failures=0
          run_gate() {
            gate="$1"
            shift
            printf '\n===== %s: %q' "$gate" "$1" | tee -a "$EVIDENCE_DIR/gates.log"
            for arg in "${@:2}"; do printf ' %q' "$arg" | tee -a "$EVIDENCE_DIR/gates.log"; done
            printf '\n' | tee -a "$EVIDENCE_DIR/gates.log"
            "$@" 2>&1 | tee -a "$EVIDENCE_DIR/gates.log"
            status=${PIPESTATUS[0]}
            printf 'gate=%s\tcommand=%q\texit=%s\n' "$gate" "$*" "$status" | tee -a "$results"
            if [ "$status" -ne 0 ]; then failures=1; fi
          }

          run_gate typecheck pnpm typecheck
          run_gate lint pnpm lint
          run_gate architecture pnpm run architecture:check -- --changed --base "$PR_BASE_SHA"
          run_gate affected-unit pnpm test:unit:affected --base "$PR_BASE_SHA"
          run_gate self-improve pnpm test:self-improve-pr

          printf 'gates_exit=%s\n' "$failures" >> "$EVIDENCE_DIR/manifest.txt"
          {
            printf '\n| Gate | Exit code |\n| --- | ---: |\n'
            while IFS=$'\t' read -r gate command status; do
              [ -n "$gate" ] || continue
              printf '| %s | %s |\n' "$gate" "${status#exit=}"
            done < "$results"
            if [ "$failures" -eq 0 ]; then
              printf '\nAll configured commands exited successfully. Affected-test selection can explicitly report that it skipped the full suite; inspect the artifact logs for that distinction.\n'
            else
              printf '\nAt least one gate failed; this candidate did not pass this workflow.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prism-candidate-${{ github.event.pull_request.number || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/prism-candidate-evidence/
          if-no-files-found: warn
          retention-days: 30
