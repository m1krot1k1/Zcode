name: Checks

# 质量门禁（typecheck / lint / unit / knip）。
# 只手动触发：仓库策略要求 hosted runners 在 Actions 计费不可用期间保持
# manual-only（见 scripts/test/prism-candidate-workflow.test.mjs），否则 tag/push
# 会不断生成失败的 hosted run。需要时在 Actions 页面手动 Run workflow。
# 桌面 E2E 不在本工作流内（见 packages/desktop 的 test:e2e 入口）。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR/分支的新提交会取消上一轮，避免大仓库重复排队。
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Documentation links
        run: node scripts/check-doc-links.mjs

  unit-affected:
    name: Unit tests (affected)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # affected 需要 base 分支的完整历史来解析 origin/<base>。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected unit tests
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: pnpm test:unit:affected --base "$BASE_REF"

  unit-full:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # test:unit 已排除 packages/desktop/test/e2e；这里只按文件分片，语义不变。
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: pnpm test:unit -- --shard=${{ matrix.shard }}/4
